<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전구 켜기 · Bulb Light</title>
<meta name="description" content="웹캠 앞에서 전구를 들면 불이 켜지고, 손과 방이 자연스럽게 밝아지는 인터랙티브 조명 효과">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='26' r='18' fill='%23ffd36b'/%3E%3Crect x='24' y='42' width='16' height='12' rx='3' fill='%23999'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #07070a; --panel: rgba(18,18,24,.82); --line: rgba(255,255,255,.12);
    --text: #f2efe8; --muted: #a29e95; --accent: #ffc861;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video { opacity: 0; pointer-events: none; }
  #overlay { pointer-events: none; }

  /* 시작 화면 */
  #intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 38%, rgba(255,190,90,.16), transparent 60%), var(--bg); z-index: 10; }
  #intro .box { max-width: 440px; text-align: center; }
  #intro .bulb { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #fff6dc 0 18%, #ffd36b 40%, rgba(255,170,60,.0) 72%);
    animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); filter: brightness(1.25); } }
  #intro h1 { font-size: 30px; margin: 0 0 10px; letter-spacing: -.02em; }
  #intro p { color: var(--muted); line-height: 1.65; margin: 0 0 8px; font-size: 15px; }
  #intro ul { text-align: left; color: var(--muted); font-size: 14px; line-height: 1.7; padding-left: 20px; margin: 16px 0 22px; }
  button.primary { appearance: none; border: 0; background: var(--accent); color: #1d1406; font-weight: 700;
    font-size: 16px; padding: 14px 28px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  #err { color: #ff8a7a; font-size: 14px; margin-top: 14px; min-height: 1em; }

  /* 상태 표시 */
  #status { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; color: var(--muted); z-index: 5; backdrop-filter: blur(10px); white-space: nowrap; }
  #status b { color: var(--accent); font-weight: 600; }

  /* 컨트롤 패널 */
  #panel { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 280px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; z-index: 5;
    backdrop-filter: blur(12px); font-size: 13px; }
  #panel summary { list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 600; display: flex; justify-content: space-between; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "▾"; color: var(--muted); }
  #panel[open] summary::after { content: "▴"; }
  #panel .body { padding: 0 16px 14px; display: grid; gap: 11px; }
  #panel label { display: grid; gap: 5px; color: var(--muted); }
  #panel label span { display: flex; justify-content: space-between; }
  #panel label span i { font-style: normal; color: var(--text); }
  #panel input[type=range] { width: 100%; accent-color: var(--accent); }
  #panel select { width: 100%; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px; font-family: inherit; }
  #panel .check { display: flex; align-items: center; gap: 8px; grid-template-columns: none; cursor: pointer; }
  #panel .check input { accent-color: var(--accent); }
  #panel .row { display: flex; gap: 8px; }
  #panel .row button { flex: 1; appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text);
    border-radius: 10px; padding: 9px 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
  #panel .row button:hover { background: rgba(255,255,255,.12); }
  #panel .reginfo { color: var(--muted); font-size: 12px; line-height: 1.5; }
  #panel .reginfo b { color: var(--text); font-weight: 600; }

  /* 전구 등록 */
  #regCta { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
    box-shadow: 0 6px 30px rgba(255,200,97,.35); }
  #reg { position: fixed; inset: 0; z-index: 8; display: grid; align-items: end; justify-items: center; padding: 16px 16px max(28px, env(safe-area-inset-bottom)); pointer-events: none; }
  #reg .card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px 26px;
    text-align: center; max-width: 360px; backdrop-filter: blur(12px); }
  #reg .step { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
  #reg h2 { margin: 6px 0 6px; font-size: 22px; letter-spacing: -.01em; }
  #reg p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  #reg .count { font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1.1; min-height: 50px; }
  #reg .bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  #reg .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
  #reg .warn { color: #ff9b85; font-size: 13px; min-height: 18px; margin-top: 8px; }
  #reg .cancel { margin-top: 8px; appearance: none; background: none; border: 0; color: var(--muted); cursor: pointer; font-family: inherit; text-decoration: underline; }
  @media (max-width: 520px) { #panel { left: 16px; right: 16px; width: auto; } }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div id="intro">
  <div class="box">
    <div class="bulb"></div>
    <h1>전구 켜기</h1>
    <p>웹캠 앞에서 전구를 들면 불이 들어오고,<br>손과 얼굴, 방까지 전구 빛으로 밝아져요.</p>
    <ul>
      <li>방 불을 조금 어둡게 하면 훨씬 진짜 같아요.</li>
      <li>전구 유리 가운데, 빛이 맺히길 원하는 자리에 <b>진한 색 펜으로 점과 십자(+)</b>를 그려 주세요. 십자 가운데에 불이 켜져요.</li>
      <li><b>초록이나 파랑</b>을 추천해요. 피부·입술 색과 겹치지 않아서 잘 찾아요.</li>
      <li>십자 모양만 찾기 때문에 빈손에는 반응하지 않아요.</li>
      <li>영상은 내 기기 안에서만 처리되고 어디로도 전송되지 않아요.</li>
    </ul>
    <button class="primary" id="start">카메라 켜고 시작</button>
    <div id="err"></div>
  </div>
</div>

<div id="status" hidden>준비 중…</div>
<button class="primary" id="regCta" hidden>🔦 내 전구 등록하기 (6초)</button>
<div id="reg" hidden>
  <div class="card">
    <div class="step" id="regStep"></div>
    <h2 id="regTitle"></h2>
    <p id="regDesc"></p>
    <div class="count" id="regCount"></div>
    <div class="bar"><i id="regBar"></i></div>
    <div class="warn" id="regWarn"></div>
    <button class="cancel" id="regCancel">취소</button>
  </div>
</div>

<details id="panel" hidden open>
  <summary>조명 설정</summary>
  <div class="body">
    <label>켜는 방식
      <select id="mode">
        <option value="hold">전구를 들고 있으면 켜짐</option>
        <option value="raise">손을 위로 들면 켜짐</option>
        <option value="click">클릭 / 스페이스바로 켜고 끄기</option>
      </select>
    </label>
    <label><span>전구 밝기 <i id="vIntensity"></i></span><input type="range" id="intensity" min="0.3" max="2.5" step="0.05" value="1.2"></label>
    <label><span>빛 크기 <i id="vSize"></i></span><input type="range" id="size" min="0.4" max="2" step="0.05" value="1"></label>
    <label><span>방 어둡기 <i id="vDark"></i></span><input type="range" id="dark" min="0" max="0.95" step="0.01" value="0.72"></label>
    <label><span>색온도 <i id="vKelvin"></i></span><input type="range" id="kelvin" min="1800" max="6000" step="100" value="2700"></label>
    <label><span>배경 그림자 <i id="vShadow"></i></span><input type="range" id="shadow" min="0" max="1" step="0.05" value="0.7"></label>
    <label class="check"><input type="checkbox" id="virtual"> 화면에 가상 전구 겹쳐 그리기</label>
    <label class="check"><input type="checkbox" id="sound" checked> 딸깍 소리</label>
    <label class="check"><input type="checkbox" id="debug"> 인식 결과 보기</label>
    <label>십자 색
      <select id="dotPreset">
        <option value="red">빨강</option>
        <option value="green">초록 (추천)</option>
        <option value="blue">파랑</option>
        <option value="custom" id="optCustom">직접 맞춘 색</option>
      </select>
    </label>
    <div class="reginfo" id="regInfo"></div>
    <div class="row">
      <button id="regBtn">🎯 색 직접 맞추기</button>
      <button id="regReset">맞춘 색 지우기</button>
    </div>
    <div class="row">
      <button id="snap">📸 사진 저장</button>
      <button id="toggle">💡 켜기/끄기</button>
    </div>
  </div>
</details>

<script type="x-shader/x-vertex" id="vs">
#version 300 es
in vec2 p; out vec2 vUv;
void main(){ vUv = vec2((p.x+1.0)*0.5, (1.0-p.y)*0.5); gl_Position = vec4(p,0.0,1.0); }
</script>
<script type="x-shader/x-fragment" id="fs">
#version 300 es
precision highp float;
#define MAXL 3
in vec2 vUv; out vec4 outColor;
uniform sampler2D uVideo, uMask;
uniform float uAspect, uAmb, uShadow, uVirtual, uHasMask, uDebug, uTime;
uniform vec3 uWarm;
uniform int uN;                 // 빛 개수
uniform vec2 uL[MAXL];          // 빛 위치
uniform vec2 uDir[MAXL];        // 전구 방향(손목→손가락)
uniform float uR[MAXL];         // 크기
uniform float uI[MAXL];         // 밝기
uniform float uT[MAXL];         // 1 = 전구, 0 = 손가락 끝 빛
uniform vec2 uHand[42];         // 양손 랜드마크
uniform int uHandN;

vec2 mir(vec2 uv){ return vec2(1.0 - uv.x, uv.y); }       // 거울 모드
float person(vec2 uv){ return uHasMask > 0.5 ? texture(uMask, mir(uv)).r : 0.0; }
vec2 A(vec2 uv){ return vec2(uv.x * uAspect, uv.y); }     // 화면비 보정 좌표

void main(){
  vec2 uv = vUv;
  vec3 srgb = texture(uVideo, mir(uv)).rgb;
  vec3 lin = pow(srgb, vec3(2.2));
  float pm = smoothstep(0.25, 0.75, person(uv));

  // 가장 가까운 손 랜드마크까지 거리
  float dh = 10.0;
  for (int i = 0; i < 42; i++) { if (i >= uHandN) break; dh = min(dh, distance(A(uv), A(uHand[i]))); }

  float flick = 1.0 + 0.025 * sin(uTime * 23.0) * sin(uTime * 7.3);
  vec3 light = vec3(0.0), sss = vec3(0.0);

  // 1) 각 빛이 사람/손/배경을 비춤
  for (int j = 0; j < MAXL; j++) {
    if (j >= uN) break;
    float I = uI[j] * flick;
    if (I < 0.002) continue;
    float R  = max(uR[j], 0.012);
    float Rr = max(R, 0.05);                       // 빛이 닿는 범위 (손가락 빛도 너무 좁지 않게)
    float d  = distance(A(uv), A(uL[j]));
    float Ip = 1.0 / (1.0 + pow(d / (Rr * 3.2), 2.0));
    float Ib = 0.55 / (1.0 + pow(d / (Rr * 6.5), 2.0));
    float sh = 0.0;                                // 배경에 드리우는 사람 그림자
    for (int i = 1; i <= 8; i++) sh += smoothstep(0.3, 0.8, person(uv + (uL[j] - uv) * (0.035 * float(i))));
    sh = (sh / 8.0) * uShadow * (1.0 - pm);
    float L = mix(Ib * (1.0 - 0.9 * sh), Ip, pm);
    float hand = exp(-pow(dh / (Rr * 0.9), 2.0)) * max(pm, 0.35);
    float nearL = exp(-pow(d / (Rr * 2.2), 2.0));
    light += uWarm * (L * 2.6 + hand * nearL * 0.9) * I;
    sss += vec3(1.0, 0.28, 0.10) * hand * nearL * 1.4 * I;   // 빛이 비쳐 붉게 물드는 손
  }
  vec3 col = lin * (uAmb + light) + lin * sss;

  // 2) 빛 자체 (빛번짐, 별빛, 가상 전구)
  for (int j = 0; j < MAXL; j++) {
    if (j >= uN) break;
    float I = uI[j] * flick;
    if (I < 0.002) continue;
    float R = max(uR[j], 0.012);
    vec2 q = A(uv) - A(uL[j]);
    float d = length(q);
    vec2 dir = normalize(uDir[j] + vec2(1e-5));
    vec2 per = vec2(-dir.y, dir.x);
    float al = dot(q, dir), ac = dot(q, per);

    if (uT[j] > 0.5) {
      if (uVirtual > 0.5) {
        float glass = d - R;
        float neckW = mix(R * 0.42, R * 0.62, smoothstep(-R * 1.5, -R * 0.6, al));
        float neck  = max(abs(ac) - neckW, max(-al - R * 1.5, al + R * 0.4));
        float gm = smoothstep(0.004, -0.004, min(glass, neck));
        float base = smoothstep(0.004, -0.004, max(abs(ac) - R * 0.43, max(-al - R * 2.1, al + R * 1.35)));
        float fil = exp(-pow(abs(ac) / (R * 0.06), 2.0)) * exp(-pow((al - R * 0.05) / (R * 0.35), 2.0));
        vec3 lit = uWarm * (1.6 + 2.5 * exp(-pow(d / R, 2.0))) + vec3(1.0, 0.95, 0.85) * fil * 4.0;
        col = mix(col, lit, gm * clamp(I, 0.0, 1.0));
        float ridges = 0.6 + 0.4 * sin(al / R * 38.0);
        vec3 metal = vec3(0.55, 0.53, 0.5) * ridges * (0.15 + 0.85 * clamp(uAmb + I * 0.8, 0.0, 1.5));
        col = mix(col, metal, base * (1.0 - gm));
      }
      float g1 = exp(-pow(d / (R * 0.7), 2.0));
      float g2 = exp(-pow(d / (R * 2.4), 2.0));
      float g3 = exp(-pow(d / (R * 7.0), 2.0));
      float streak = exp(-pow(ac / (R * 0.12), 2.0)) * exp(-pow(al / (R * 6.0), 2.0));
      col += (vec3(1.0, 0.97, 0.9) * g1 * 1.8 + uWarm * g2 * 0.7 + uWarm * g3 * 0.18 + uWarm * streak * 0.08) * I;
    } else {
      // 손가락 끝에 맺힌 작은 빛: 밝은 핵 + 번짐 + 십자 별빛
      float core = exp(-pow(d / (R * 0.32), 2.0));
      float halo = exp(-pow(d / (R * 1.3), 2.0));
      float wide = exp(-pow(d / (R * 5.0), 2.0));
      float tw = 0.85 + 0.15 * sin(uTime * 9.0 + float(j) * 2.1);
      float star = exp(-pow(q.x / (R * 0.05), 2.0)) * exp(-pow(q.y / (R * 2.6 * tw), 2.0))
                 + exp(-pow(q.y / (R * 0.05), 2.0)) * exp(-pow(q.x / (R * 2.6 * tw), 2.0));
      col += (vec3(1.0, 0.98, 0.94) * core * 2.4 + uWarm * halo * 0.9 + uWarm * wide * 0.22 + mix(vec3(1.0), uWarm, 0.4) * star * 0.45) * I;
    }
  }

  col = col * (1.0 + col / 6.0) / (1.0 + col);
  col = pow(col, vec3(1.0 / 2.2));
  if (uDebug > 0.5) col = mix(col, vec3(0.1, 0.6, 1.0), pm * 0.35);
  outColor = vec4(col, 1.0);
}
</script>

<script type="module">
import { FilesetResolver, HandLandmarker, ImageSegmenter }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const video = $("video"), glc = $("gl"), ovc = $("overlay");
const statusEl = $("status");

/* ---------------- 설정 ---------------- */
const ui = {};
for (const id of ["mode","intensity","size","dark","kelvin","shadow","virtual","sound","debug","dotPreset"]) ui[id] = $(id);
function readUI() {
  $("vIntensity").textContent = (+ui.intensity.value).toFixed(2);
  $("vSize").textContent = (+ui.size.value).toFixed(2) + "x";
  $("vDark").textContent = Math.round(ui.dark.value * 100) + "%";
  $("vKelvin").textContent = ui.kelvin.value + "K";
  $("vShadow").textContent = Math.round(ui.shadow.value * 100) + "%";
}
document.querySelectorAll("#panel input, #panel select").forEach(el => el.addEventListener("input", readUI));
readUI();

// 색온도(K) → RGB (Tanner Helland 근사)
function kelvinToRGB(k) {
  const t = k / 100; let r, g, b;
  r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
  g = t <= 66 ? 99.47 * Math.log(t) - 161.12 : 288.12 * Math.pow(t - 60, -0.0755);
  b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04);
  const c = v => Math.min(1, Math.max(0, v / 255));
  return [c(r), c(g), c(b)];
}

/* ---------------- WebGL ---------------- */
const gl = glc.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
if (!gl) { $("err").textContent = "이 브라우저는 WebGL2를 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요."; }

const VS = document.getElementById("vs").textContent.trim();
const FS = document.getElementById("fs").textContent.trim();
const MAXL = 3;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog, U = {}, texVideo, texMask;
function initGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ["uVideo","uMask","uAspect","uAmb","uShadow","uVirtual","uHasMask","uDebug","uTime","uWarm",
                   "uN","uL","uDir","uR","uI","uT","uHand","uHandN"])
    U[n] = gl.getUniformLocation(prog, n);
  const mk = () => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  texVideo = mk(); texMask = mk();
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  gl.uniform1i(U.uVideo, 0); gl.uniform1i(U.uMask, 1);
}

/* ---------------- 상태 ---------------- */
const S = { mask: null, maskW: 0, maskH: 0, hasMask: false, maskDirty: false };
// 클릭 모드용 수동 전구
const manual = { on: false, I: 0, flickerT: -1, L: { x: 0.5, y: 0.38 }, R: 0.07, dir: { x: 0, y: -1 } };

let actx = null;
function click(on) {
  if (!ui.sound.checked) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, len = 0.04;
    const b = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);

function updateHand(H, lms, now) {
  const P = lms.map(p => ({ x: 1 - p.x, y: p.y }));      // 거울 좌표
  H.P = P;
  const ax = v => ({ x: v.x * aspect, y: v.y });
  const w = ax(P[0]), m = ax(P[9]);
  const palm = [0, 5, 9, 13, 17].map(i => ax(P[i])).reduce((a, b) => ({ x: a.x + b.x / 5, y: a.y + b.y / 5 }), { x: 0, y: 0 });
  let dx = m.x - w.x, dy = m.y - w.y; const Lp = Math.hypot(dx, dy) || 0.1; dx /= Lp; dy /= Lp;
  const k = H.seen ? 0.6 : 1;
  H.palm.x += (palm.x - H.palm.x) * k; H.palm.y += (palm.y - H.palm.y) * k;
  H.dir.x += (dx - H.dir.x) * k; H.dir.y += (dy - H.dir.y) * k;
  const dl = Math.hypot(H.dir.x, H.dir.y) || 1; H.dir.x /= dl; H.dir.y /= dl;
  H.Lp += (Lp - H.Lp) * k;
  H.seen = true; H.lastSeen = now;
}

// 십자 색: 미리 정한 색(빨강/초록/파랑) 또는 화면에서 읽어 온 내 색

function hsv(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 0) {
    if (mx === r) h = 60 * (((g - b) / d) % 6);
    else if (mx === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
    if (h < 0) h += 360;
  }
  return { h, s: mx ? d / mx : 0, v: mx / 255 };
}
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
// 점 색이면 채도를, 아니면 0을 돌려줌
function dotSat(r, g, b) {
  const c = hsv(r, g, b);
  return c.s >= dotColor.s && c.v >= dotColor.v && hueDist(c.h, dotColor.h) <= dotColor.tol ? c.s : 0;
}
let maskBuf = new Uint8Array(0), stackBuf = new Int32Array(0), satBuf = new Float32Array(0);
let compBuf = new Int32Array(0);
const NB = 32, binR = new Float32Array(NB);
// 덩어리 모양이 십자(+)인지: 중심에서 각 방향으로 얼마나 뻗었는지 재서
// 90도마다 반복되는 정도(십자) vs 180도마다 반복되는 정도(입술 같은 긴 타원)를 비교
function crossness(pix, cnt, w, cxp, cyp) {
  binR.fill(0);
  for (let k = 0; k < cnt; k++) {
    const j = pix[k], dx = (j % w) - cxp, dy = ((j / w) | 0) - cyp;
    const r = Math.hypot(dx, dy) + 0.5;
    const b = Math.min(NB - 1, Math.floor((Math.atan2(dy, dx) + Math.PI) / (2 * Math.PI) * NB));
    if (r > binR[b]) binR[b] = r;
  }
  let m = 0, c2 = 0, s2 = 0, c4 = 0, s4 = 0;
  for (let b = 0; b < NB; b++) {
    const th = (b + 0.5) / NB * 2 * Math.PI, r = binR[b];
    m += r; c2 += r * Math.cos(2 * th); s2 += r * Math.sin(2 * th); c4 += r * Math.cos(4 * th); s4 += r * Math.sin(4 * th);
  }
  m /= NB;
  if (m < 1e-3) return { cross: 0, elong: 1, size: 0 };
  return { cross: Math.hypot(c4, s4) / NB / m, elong: Math.hypot(c2, s2) / NB / m, size: m };
}
// 손 주변에서 빨간 십자를 찾아 그 가운데를 돌려줌 (화면 좌표, 거울 기준)
function findDot(H, now) {
  grabFrame();
  const vw = frameC.width, vh = frameC.height;
  const r = 3.2 * H.Lp * vh;
  const cx = (1 - H.palm.x / aspect) * vw, cy = H.palm.y * vh;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(vw, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(vh, Math.ceil(cy + r));
  const w = x1 - x0, h = y1 - y0;
  H.roi = { x0, y0, w, h, vw, vh };
  if (w < 4 || h < 4) return null;
  const d = fctx.getImageData(x0, y0, w, h).data;
  const n = w * h;
  if (maskBuf.length < n) { maskBuf = new Uint8Array(n); stackBuf = new Int32Array(n); satBuf = new Float32Array(n); compBuf = new Int32Array(n); }
  const m = maskBuf, sat = satBuf;
  for (let i = 0; i < n; i++) { const v = dotSat(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]); sat[i] = v; m[i] = v > 0 ? 1 : 0; }
  if (ui.debug.checked) H.dbgMask = { w, h, m: m.slice(0, n) }; else H.dbgMask = null;
  // 방금까지 따라가던 자리 (잠깐 흐려져서 십자 모양이 안 보여도 이 근처면 봐줌)
  const locked = H.dot && now - H.dotSeen < 400;
  const prev = H.dot ? { x: (1 - H.dot.x) * vw - x0, y: H.dot.y * vh - y0 } : null;
  const near = H.Lp * vh * 0.45;
  const minArea = 6, maxArea = Math.max(80, (H.Lp * vh * 1.2) ** 2);
  let best = null;
  for (let i = 0; i < n; i++) {
    if (m[i] !== 1) continue;
    let sp = 0, cnt = 0, sx = 0, sy = 0, ss = 0;
    stackBuf[sp++] = i; m[i] = 2;
    while (sp) {
      const j = stackBuf[--sp], jx = j % w, jy = (j / w) | 0, wj = sat[j];
      compBuf[cnt++] = j; sx += jx * wj; sy += jy * wj; ss += wj;
      if (jx > 0 && m[j - 1] === 1) { m[j - 1] = 2; stackBuf[sp++] = j - 1; }
      if (jx < w - 1 && m[j + 1] === 1) { m[j + 1] = 2; stackBuf[sp++] = j + 1; }
      if (jy > 0 && m[j - w] === 1) { m[j - w] = 2; stackBuf[sp++] = j - w; }
      if (jy < h - 1 && m[j + w] === 1) { m[j + w] = 2; stackBuf[sp++] = j + w; }
    }
    if (cnt < minArea || cnt > maxArea) continue;
    const bx = sx / ss, by = sy / ss;
    const sh = crossness(compBuf, cnt, w, bx, by);
    const isCross = sh.size >= 3 && sh.cross > 0.12 && sh.cross > sh.elong * 1.15;
    const dPrev = prev ? Math.hypot(bx - prev.x, by - prev.y) : 1e9;
    const keep = locked && dPrev < near && sh.elong < 0.35;    // 따라가던 십자가 잠깐 뭉개진 경우
    if (!isCross && !keep) continue;
    let score = (isCross ? 2 : 0) + sh.cross * 4 + Math.sqrt(cnt) * 0.05 - sh.elong;
    if (prev) score -= dPrev / (H.Lp * vh) * 2;
    if (!best || score > best.score) best = { score, bx, by, cnt, cross: sh.cross, elong: sh.elong, isCross };
  }
  if (!best) return null;
  return { x: 1 - (x0 + best.bx + 0.5) / vw, y: (y0 + best.by + 0.5) / vh, area: best.cnt, cross: best.cross, isCross: best.isCross };
}

/* ---------------- 십자 색 직접 맞추기 (선택) ---------------- */
const GUIDE = { x: 0.5, y: 0.4, s: 0.12 };
const RS = { phase: null, t0: 0, samples: [] };
const PHASES = {
  prep: { next: "rec", dur: 3000, step: "준비", title: "십자 가운데를 작은 원에 대 주세요", desc: "전구에 그린 십자가 화면 가운데 작은 원 안에 오도록 들어 주세요." },
  rec:  { next: "done", dur: 2000, rec: true, step: "색 읽는 중", title: "십자 색 읽는 중", desc: "그대로 잠깐만 들고 있어 주세요." },
};
function startReg() {
  RS.samples = [];
  setPhase("prep");
  $("reg").hidden = false;
}
function setPhase(ph) {
  RS.phase = ph; RS.t0 = performance.now();
  if (ph === "done") {
    $("reg").hidden = true; RS.phase = null;
    const A = RS.samples;
    let ok = false;
    if (A.length >= 20) {
      // 가장 많이 보인 색상대를 고름 (원 안에 배경이 조금 섞여도 괜찮게)
      const hist = new Float32Array(36);
      // 진한 픽셀일수록 크게 침. 피부·따뜻한 벽 색(15~45도)은 후보에서 뺌
      for (const c of A) { const b = Math.floor(c.h / 10) % 36; if (c.h >= 15 && c.h <= 45) continue; hist[b] += c.s ** 4; }
      let pb = 0; for (let i = 1; i < 36; i++) if (hist[i] > hist[pb]) pb = i;
      const B = A.filter(c => hueDist(c.h, pb * 10 + 5) <= 25 && c.s > 0.5);
      let sx = 0, sy = 0; for (const c of B) { sx += Math.cos(c.h * Math.PI / 180); sy += Math.sin(c.h * Math.PI / 180); }
      let h = Math.atan2(sy, sx) * 180 / Math.PI; if (h < 0) h += 360;
      if (B.length < 20) {
        alert("십자 색을 읽지 못했어요. 십자가 가운데 작은 원 안에 오도록 다시 시도해 주세요.");
      } else if (hueDist(h, 22) < 14) {
        alert("피부색과 너무 비슷한 색이라 쓰기 어려워요. 초록이나 파랑 펜을 추천해요.");
      } else {
        const ss = B.map(c => c.s).sort((a, b) => a - b), vv = B.map(c => c.v).sort((a, b) => a - b);
        const dev = B.map(c => hueDist(c.h, h)).sort((a, b) => a - b);
        customColor = { h, s: Math.max(0.3, ss[Math.floor(ss.length * 0.15)] * 0.75), v: Math.max(0.12, vv[Math.floor(vv.length * 0.15)] * 0.6),
                        tol: Math.min(25, Math.max(12, dev[Math.floor(dev.length * 0.9)] + 6)) };
        try { localStorage.setItem(COLOR_KEY, JSON.stringify(customColor)); } catch (e) {}
        $("optCustom").disabled = false; ui.dotPreset.value = "custom"; applyPreset();
        ok = true;
      }
    } else {
      alert("색이 진한 십자가 안 보여요. 십자가 가운데 작은 원 안에 오도록 다시 시도해 주세요.");
    }
    refreshRegUI(); return;
  }
  const P = PHASES[ph];
  $("regStep").textContent = P.step; $("regTitle").textContent = P.title; $("regDesc").textContent = P.desc;
  $("regCount").textContent = ""; $("regBar").style.width = "0%";
}
function cancelReg() { RS.phase = null; $("reg").hidden = true; refreshRegUI(); }
function stepReg(now) {
  if (!RS.phase) return;
  const P = PHASES[RS.phase], el = now - RS.t0;
  $("regBar").style.width = Math.min(100, el / P.dur * 100) + "%";
  if (P.rec) {
    // 가운데 원 안에서 색이 진한 픽셀만 모음 (어떤 색이든)
    grabFrame();
    const vw = frameC.width, vh = frameC.height, r = Math.round(GUIDE.s * vh / 2);
    const cx = Math.round((1 - GUIDE.x) * vw), cy = Math.round(GUIDE.y * vh);
    const d = fctx.getImageData(cx - r, cy - r, r * 2, r * 2).data;
    for (let y = 0; y < r * 2; y++) for (let x = 0; x < r * 2; x++) {
      if ((x - r) ** 2 + (y - r) ** 2 > r * r) continue;
      const i = (y * r * 2 + x) * 4, c = hsv(d[i], d[i + 1], d[i + 2]);
      if (c.s > 0.4 && c.v > 0.15) RS.samples.push(c);
    }
    if (RS.samples.length > 4000) RS.samples.splice(0, RS.samples.length - 4000);
    $("regCount").textContent = "";
    $("regWarn").textContent = RS.samples.length < 20 ? "색이 진한 십자가 안 보여요. 작은 원 안에 맞춰 주세요." : "";
  } else {
    $("regCount").textContent = Math.max(1, Math.ceil((P.dur - el) / 1000));
    $("regWarn").textContent = "";
  }
  if (el >= P.dur) setPhase(P.next);
}
function refreshRegUI() {
  const names = { red: "빨간", green: "초록", blue: "파란" }, p = ui.dotPreset.value;
  const sw = '<i style="display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;background:hsl(' + Math.round(dotColor.h) + ',85%,50%)"></i> ';
  $("regInfo").innerHTML = sw + (p === "custom"
    ? "<b>직접 맞춘 색</b>의 십자를 찾아요"
    : "<b>" + names[p] + "</b> 십자를 찾아요. 잘 안 잡히면 <b>색 직접 맞추기</b>를 해 보세요.");

$("regBtn").addEventListener("click", startReg);

$("regReset").addEventListener("click", () => {

const visibleHands = () => [...hands.values()].filter(H => H.seen);

// 손마다 매 프레임 빨간 점을 찾음. 2프레임 연속 보이면 켜고, 잠깐(0.2초) 가려지는 건 봐줌
function stepFind(now) {
  if (RS.phase) { hands.forEach(H => { H.hasBulb = false; }); return; }
  for (const H of visibleHands()) {
    const r = findDot(H, now);
    if (r) {
      if (!H.dot || now - H.dotSeen > 300) H.dot = { x: r.x, y: r.y };
      else { const k = 0.7; H.dot.x += (r.x - H.dot.x) * k; H.dot.y += (r.y - H.dot.y) * k; }
      H.dotSeen = now; H.dotArea = r.area; H.dotCross = r.cross;
      H.dotHits = Math.min(H.dotHits + 1, 10);
      if (H.dotHits >= 2) H.hasBulb = true;
    } else {
      H.dotHits = 0;
      if (now - H.dotSeen > 200) H.hasBulb = false;
    }
  }
}

/* ---------------- 켜짐 판단 + 깜빡임 ---------------- */
const FLICKER = [0, 0.7, 0.05, 0.9, 0.25, 1.0];  // 켜질 때 파르르
function bulbWanted(H) {
  if (!H.seen || !H.hasBulb || !H.dot || RS.phase) return false;
  const mode = ui.mode.value;
  if (mode === "click") return false;
  if (mode === "raise") return H.dot.y < 0.42;
  return true;
}
function stepLight(o, want, idle, now, dt) {
  if (want && !o.on) { o.on = true; o.flickerT = now; click(true); }
  if (!want && o.on) { o.on = false; o.flickerT = -1; click(false); }
  const max = +ui.intensity.value;
  if (o.on && o.flickerT >= 0) {
    const e = (now - o.flickerT) / 70 | 0;
    if (e < FLICKER.length) { o.I = FLICKER[e] * max; return; }
    o.flickerT = -1;
  }
  const target = o.on ? max : idle;
  o.I += (target - o.I) * Math.min(1, dt * (o.on ? 10 : 7));
}
function stepHands(now, dt) {
  for (const [key, H] of hands) {
    if (H.seen && now - H.lastSeen > 250) { H.seen = false; H.hasBulb = false; }
    stepLight(H, bulbWanted(H), 0, now, dt);   // 점이 없으면 아무 빛도 없음
    if (H.dot) {
      // 빛은 빨간 점 바로 그 자리. 지연을 줄이려고 거의 바로 따라감
      if (!H.L) H.L = { x: H.dot.x, y: H.dot.y };
      const k = Math.min(1, dt * 40);
      H.L.x += (H.dot.x - H.L.x) * k; H.L.y += (H.dot.y - H.L.y) * k;
    }
    const tR = H.Lp * 0.3 * +ui.size.value;
    H.R += (tR - H.R) * Math.min(1, dt * 12);
    if (!H.seen && H.I < 0.005) hands.delete(key);
  }
  stepLight(manual, ui.mode.value === "click" && manual.on, 0, now, dt);
}

/* ---------------- 오버레이 (안내 원 + 디버그) ---------------- */
const octx = ovc.getContext("2d"), dbgC = document.createElement("canvas");
function drawOverlay() {
  octx.clearRect(0, 0, ovc.width, ovc.height);
  const W = ovc.width, H = ovc.height;
  if (RS.phase) {
    const r = GUIDE.s * H / 2, cx = GUIDE.x * W, cy = GUIDE.y * H, c = r * 0.5;
    octx.lineWidth = 3; octx.strokeStyle = RS.phase === "rec" ? "#ffc861" : "rgba(255,255,255,.9)";
    octx.setLineDash(RS.phase === "rec" ? [] : [8, 6]);
    octx.beginPath(); octx.arc(cx, cy, r, 0, 7); octx.stroke(); octx.setLineDash([]);
    octx.beginPath(); octx.moveTo(cx - c, cy); octx.lineTo(cx + c, cy); octx.moveTo(cx, cy - c); octx.lineTo(cx, cy + c); octx.stroke();
  }
  if (!ui.debug.checked) return;
  const sx = W, sy = H;
  for (const h of visibleHands()) {
    octx.fillStyle = "#4cf";
    for (const p of h.P) { octx.beginPath(); octx.arc(p.x * sx, p.y * sy, 4, 0, 7); octx.fill(); }
    if (h.roi) {
      // 점을 찾는 영역 (거울 기준으로 다시 그림)
      const R = h.roi, rx = (1 - (R.x0 + R.w) / R.vw) * sx, ry = R.y0 / R.vh * sy;
      octx.strokeStyle = "rgba(255,255,255,.35)"; octx.setLineDash([6, 6]); octx.lineWidth = 1.5;
      octx.strokeRect(rx, ry, R.w / R.vw * sx, R.h / R.vh * sy); octx.setLineDash([]);
      if (h.dbgMask && h.dbgMask.w === R.w && h.dbgMask.h === R.h) {
        // 십자 색으로 인식된 픽셀 (하늘색)
        const M = h.dbgMask, img = new ImageData(M.w, M.h);
        for (let i = 0; i < M.m.length; i++) if (M.m[i]) { img.data[i * 4] = 0; img.data[i * 4 + 1] = 230; img.data[i * 4 + 2] = 255; img.data[i * 4 + 3] = 200; }
        dbgC.width = M.w; dbgC.height = M.h; dbgC.getContext("2d").putImageData(img, 0, 0);
        octx.save(); octx.translate(rx + R.w / R.vw * sx, ry); octx.scale(-1, 1);
        octx.drawImage(dbgC, 0, 0, R.w / R.vw * sx, R.h / R.vh * sy); octx.restore();
      }
    }
    if (h.dot) {
      const fx = h.dot.x * sx, fy = h.dot.y * sy;
      octx.strokeStyle = h.hasBulb ? "#ff5a5a" : "rgba(255,255,255,.6)"; octx.lineWidth = 2;
      octx.beginPath(); octx.moveTo(fx - 12, fy); octx.lineTo(fx + 12, fy); octx.moveTo(fx, fy - 12); octx.lineTo(fx, fy + 12); octx.stroke();
      octx.fillStyle = "rgba(0,0,0,.6)"; octx.fillRect(fx + 14, fy - 12, 120, 24);
      octx.fillStyle = h.hasBulb ? "#ffc861" : "#ddd"; octx.font = "600 13px system-ui";
      octx.fillText(h.hasBulb ? "십자 찾음 · " + Math.round((h.dotCross || 0) * 100) : "놓침", fx + 20, fy + 5);
    }
  }
}

/* ---------------- 메인 루프 ---------------- */
let frame = 0, lastT = performance.now(), lastVideoTime = -1, fpsAcc = 0, fpsN = 0, fps = 0;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (video.readyState < 2) return;

  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    frame++;
    if (handLM) {
      const r = handLM.detectForVideo(video, now);
      const used = new Set();
      (r.landmarks || []).forEach((lms, i) => {
        let key = (r.handednesses && r.handednesses[i] && r.handednesses[i][0] && r.handednesses[i][0].categoryName) || ("h" + i);
        if (used.has(key)) key += i;
        used.add(key);
        if (!hands.has(key)) hands.set(key, newHand());
        updateHand(hands.get(key), lms, now);
      });
    }
    if (segm && frame % 2 === 0) {
      segm.segmentForVideo(video, now, (res) => {
        const masks = res.confidenceMasks; if (!masks || !masks.length) return;
        const mk = masks[masks.length - 1];
        const f = mk.getAsFloat32Array(), w = mk.width, h = mk.height;
        if (!S.mask || S.mask.length !== w * h) { S.mask = new Uint8Array(w * h); S.maskW = w; S.maskH = h; }
        const M = S.mask;
        for (let i = 0; i < f.length; i++) M[i] = (M[i] * 0.4 + f[i] * 255 * 0.6) | 0;  // 시간축 스무딩
        S.hasMask = true; S.maskDirty = true;
      });
    }
    stepFind(now);
    stepReg(now);
  }
  stepHands(now, dt);

  // 빛 목록 만들기
  const lights = [];
  for (const H of hands.values()) if (H.L && H.I > 0.002) lights.push({ L: H.L, dir: H.dir, R: H.R, I: H.I, T: 1 });
  if (manual.I > 0.002) lights.push({ L: manual.L, dir: manual.dir, R: manual.R, I: manual.I, T: 1 });
  const n = Math.min(MAXL, lights.length);
  const aL = new Float32Array(MAXL * 2), aD = new Float32Array(MAXL * 2), aR = new Float32Array(MAXL), aI = new Float32Array(MAXL), aT = new Float32Array(MAXL);
  for (let i = 0; i < n; i++) {
    const l = lights[i];
    aL[i * 2] = l.L.x; aL[i * 2 + 1] = l.L.y; aD[i * 2] = l.dir.x; aD[i * 2 + 1] = l.dir.y;
    aR[i] = l.R; aI[i] = l.I; aT[i] = l.T;
  }
  const hp = new Float32Array(84); let hn = 0;
  for (const H of hands.values()) if (H.seen) for (const p of H.P) { if (hn < 42) { hp[hn * 2] = p.x; hp[hn * 2 + 1] = p.y; hn++; } }

  // 렌더
  gl.viewport(0, 0, glc.width, glc.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVideo);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  if (S.maskDirty) { gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, S.maskW, S.maskH, 0, gl.RED, gl.UNSIGNED_BYTE, S.mask); S.maskDirty = false; }

  const dark = +ui.dark.value;
  gl.uniform1f(U.uAspect, aspect);
  gl.uniform1f(U.uAmb, RS.phase ? 0.85 : Math.pow(1 - dark, 1.6));
  gl.uniform1f(U.uShadow, +ui.shadow.value);
  gl.uniform1f(U.uVirtual, ui.virtual.checked ? 1 : 0);
  gl.uniform1f(U.uHasMask, S.hasMask ? 1 : 0);
  gl.uniform1f(U.uDebug, ui.debug.checked ? 1 : 0);
  gl.uniform1f(U.uTime, now / 1000);
  gl.uniform3fv(U.uWarm, kelvinToRGB(+ui.kelvin.value));
  gl.uniform1i(U.uN, n);
  gl.uniform2fv(U.uL, aL); gl.uniform2fv(U.uDir, aD);
  gl.uniform1fv(U.uR, aR); gl.uniform1fv(U.uI, aI); gl.uniform1fv(U.uT, aT);
  gl.uniform2fv(U.uHand, hp);
  gl.uniform1i(U.uHandN, hn);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawOverlay();

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; updateStatus(); }
}

function updateStatus() {
  let msg;
  const vis = visibleHands();
  if (!handLM) msg = "인식 모델 불러오는 중…";
  else if (RS.phase) msg = "십자 색 맞추는 중…";
  else if (ui.mode.value === "click") msg = manual.on ? "<b>켜짐</b> · 클릭하거나 스페이스바로 끄기" : "클릭하거나 스페이스바를 눌러 켜기";
  else if (vis.some(H => H.on)) msg = "<b>💡 켜짐</b>";
  else if (ui.mode.value === "raise" && vis.some(H => H.hasBulb)) msg = "전구를 위로 들어 올리면 켜져요";
  else msg = "십자(+)를 그린 전구를 들어 주세요";
  statusEl.innerHTML = msg + (ui.debug.checked ? " · " + fps + "fps" : "");
}

/* ---------------- 시작 ---------------- */
async function loadModels() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk = async (Cls, opts) => {
    try { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: "GPU" } }); }
    catch (e) { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: "CPU" } }); }
  };
  const [h, s] = await Promise.all([
    mk(HandLandmarker, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
      runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    }),
    mk(ImageSegmenter, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite" },
      runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false,
    }),
  ]);
  handLM = h; segm = s;
  refreshRegUI();
}

function resize() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  aspect = vw / vh;
  glc.width = ovc.width = vw; glc.height = ovc.height = vh;
}

$("start").addEventListener("click", async () => {
  const btn = $("start"); btn.disabled = true; btn.textContent = "카메라 연결 중…"; $("err").textContent = "";
  try {
    initGL();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    video.srcObject = stream; await video.play();
    resize(); video.addEventListener("resize", resize);
    $("intro").hidden = true;
    statusEl.hidden = false; $("panel").hidden = false;
    if (innerWidth < 520) $("panel").open = false;
    requestAnimationFrame(loop);
    refreshRegUI();
    loadModels().catch(e => { console.error(e); statusEl.textContent = "인식 모델을 불러오지 못했어요. 새로고침해 주세요."; });
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = "다시 시도";
    $("err").textContent = e && e.name === "NotAllowedError"
      ? "카메라 권한이 거부됐어요. 주소창의 카메라 아이콘에서 허용해 주세요."
      : "카메라를 켤 수 없어요: " + (e.message || e);
  }
});

function toggleManual() {
  ui.mode.value = "click"; manual.on = !manual.on; updateStatus();
}
$("toggle").addEventListener("click", toggleManual);
$("stage").addEventListener("click", () => { if (ui.mode.value === "click") { manual.on = !manual.on; updateStatus(); } });
addEventListener("keydown", (e) => { if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT") { e.preventDefault(); toggleManual(); } });
ui.mode.addEventListener("change", updateStatus);

$("snap").addEventListener("click", () => {
  glc.toBlob((b) => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = "bulb-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
});
</script>
