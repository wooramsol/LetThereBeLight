<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전구 켜기 · Bulb Light</title>
<meta name="description" content="웹캠 앞에서 전구를 들면 불이 켜지고, 손과 방이 자연스럽게 밝아지는 인터랙티브 조명 효과">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='26' r='18' fill='%23ffd36b'/%3E%3Crect x='24' y='42' width='16' height='12' rx='3' fill='%23999'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #07070a; --panel: rgba(18,18,24,.82); --line: rgba(255,255,255,.12);
    --text: #f2efe8; --muted: #a29e95; --accent: #ffc861;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video { opacity: 0; pointer-events: none; }
  #overlay { pointer-events: none; }

  /* 시작 화면 */
  #intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 38%, rgba(255,190,90,.16), transparent 60%), var(--bg); z-index: 10; }
  #intro .box { max-width: 440px; text-align: center; }
  #intro .bulb { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #fff6dc 0 18%, #ffd36b 40%, rgba(255,170,60,.0) 72%);
    animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); filter: brightness(1.25); } }
  #intro h1 { font-size: 30px; margin: 0 0 10px; letter-spacing: -.02em; }
  #intro p { color: var(--muted); line-height: 1.65; margin: 0 0 8px; font-size: 15px; }
  #intro ul { text-align: left; color: var(--muted); font-size: 14px; line-height: 1.7; padding-left: 20px; margin: 16px 0 22px; }
  button.primary { appearance: none; border: 0; background: var(--accent); color: #1d1406; font-weight: 700;
    font-size: 16px; padding: 14px 28px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  #err { color: #ff8a7a; font-size: 14px; margin-top: 14px; min-height: 1em; }

  /* 상태 표시 */
  #status { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; color: var(--muted); z-index: 5; backdrop-filter: blur(10px); white-space: nowrap; }
  #status b { color: var(--accent); font-weight: 600; }

  /* 컨트롤 패널 */
  #panel { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 280px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; z-index: 5;
    backdrop-filter: blur(12px); font-size: 13px; }
  #panel summary { list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 600; display: flex; justify-content: space-between; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "▾"; color: var(--muted); }
  #panel[open] summary::after { content: "▴"; }
  #panel .body { padding: 0 16px 14px; display: grid; gap: 11px; }
  #panel label { display: grid; gap: 5px; color: var(--muted); }
  #panel label span { display: flex; justify-content: space-between; }
  #panel label span i { font-style: normal; color: var(--text); }
  #panel input[type=range] { width: 100%; accent-color: var(--accent); }
  #panel select { width: 100%; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px; font-family: inherit; }
  #panel .check { display: flex; align-items: center; gap: 8px; grid-template-columns: none; cursor: pointer; }
  #panel .check input { accent-color: var(--accent); }
  #panel .row { display: flex; gap: 8px; }
  #panel .row button { flex: 1; appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text);
    border-radius: 10px; padding: 9px 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
  #panel .row button:hover { background: rgba(255,255,255,.12); }
  #panel .reginfo { color: var(--muted); font-size: 12px; line-height: 1.5; }
  #panel .reginfo b { color: var(--text); font-weight: 600; }

  /* 전구 등록 */
  #regCta { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
    box-shadow: 0 6px 30px rgba(255,200,97,.35); }
  #reg { position: fixed; inset: 0; z-index: 8; display: grid; align-items: end; justify-items: center; padding: 16px 16px max(28px, env(safe-area-inset-bottom)); pointer-events: none; }
  #reg .card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px 26px;
    text-align: center; max-width: 360px; backdrop-filter: blur(12px); }
  #reg .step { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
  #reg h2 { margin: 6px 0 6px; font-size: 22px; letter-spacing: -.01em; }
  #reg p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  #reg .count { font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1.1; min-height: 50px; }
  #reg .bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  #reg .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
  #reg .warn { color: #ff9b85; font-size: 13px; min-height: 18px; margin-top: 8px; }
  #reg .cancel { margin-top: 8px; appearance: none; background: none; border: 0; color: var(--muted); cursor: pointer; font-family: inherit; text-decoration: underline; }
  @media (max-width: 520px) { #panel { left: 16px; right: 16px; width: auto; } }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div id="intro">
  <div class="box">
    <div class="bulb"></div>
    <h1>전구 켜기</h1>
    <p>웹캠 앞에서 전구를 들면 불이 들어오고,<br>손과 얼굴, 방까지 전구 빛으로 밝아져요.</p>
    <ul>
      <li>방 불을 조금 어둡게 하면 훨씬 진짜 같아요.</li>
      <li>처음에 한 번 <b>내 전구를 등록</b>해 주세요. 화면 가운데 원에 전구를 6초만 비추면 돼요.</li>
      <li>등록하면 빈손에는 반응하지 않고, 전구를 찾아서 그 자리에 불을 켜요.</li>
      <li>영상은 내 기기 안에서만 처리되고 어디로도 전송되지 않아요.</li>
    </ul>
    <button class="primary" id="start">카메라 켜고 시작</button>
    <div id="err"></div>
  </div>
</div>

<div id="status" hidden>준비 중…</div>
<button class="primary" id="regCta" hidden>🔦 내 전구 등록하기 (6초)</button>
<div id="reg" hidden>
  <div class="card">
    <div class="step" id="regStep"></div>
    <h2 id="regTitle"></h2>
    <p id="regDesc"></p>
    <div class="count" id="regCount"></div>
    <div class="bar"><i id="regBar"></i></div>
    <div class="warn" id="regWarn"></div>
    <button class="cancel" id="regCancel">취소</button>
  </div>
</div>

<details id="panel" hidden open>
  <summary>조명 설정</summary>
  <div class="body">
    <label>켜는 방식
      <select id="mode">
        <option value="hold">전구를 들고 있으면 켜짐</option>
        <option value="raise">손을 위로 들면 켜짐</option>
        <option value="click">클릭 / 스페이스바로 켜고 끄기</option>
      </select>
    </label>
    <label><span>전구 밝기 <i id="vIntensity"></i></span><input type="range" id="intensity" min="0.3" max="2.5" step="0.05" value="1.2"></label>
    <label><span>방 어둡기 <i id="vDark"></i></span><input type="range" id="dark" min="0" max="0.95" step="0.01" value="0.72"></label>
    <label><span>색온도 <i id="vKelvin"></i></span><input type="range" id="kelvin" min="1800" max="6000" step="100" value="2700"></label>
    <label><span>배경 그림자 <i id="vShadow"></i></span><input type="range" id="shadow" min="0" max="1" step="0.05" value="0.7"></label>
    <label class="check"><input type="checkbox" id="virtual"> 화면에 가상 전구 겹쳐 그리기</label>
    <label class="check"><input type="checkbox" id="sound" checked> 딸깍 소리</label>
    <label class="check"><input type="checkbox" id="debug"> 인식 결과 보기</label>
    <div class="reginfo" id="regInfo"></div>
    <div class="row">
      <button id="regBtn">🔦 내 전구 등록</button>
      <button id="regReset">등록 지우기</button>
    </div>
    <div class="row">
      <button id="snap">📸 사진 저장</button>
      <button id="toggle">💡 켜기/끄기</button>
    </div>
  </div>
</details>

<script type="x-shader/x-vertex" id="vs">
#version 300 es
in vec2 p; out vec2 vUv;
void main(){ vUv = vec2((p.x+1.0)*0.5, (1.0-p.y)*0.5); gl_Position = vec4(p,0.0,1.0); }
</script>
<script type="x-shader/x-fragment" id="fs">
#version 300 es
precision highp float;
#define MAXL 3
in vec2 vUv; out vec4 outColor;
uniform sampler2D uVideo, uMask;
uniform float uAspect, uAmb, uShadow, uVirtual, uHasMask, uDebug, uTime;
uniform vec3 uWarm;
uniform int uN;                 // 빛 개수
uniform vec2 uL[MAXL];          // 빛 위치
uniform vec2 uDir[MAXL];        // 전구 방향(손목→손가락)
uniform float uR[MAXL];         // 크기
uniform float uI[MAXL];         // 밝기
uniform float uT[MAXL];         // 1 = 전구, 0 = 손가락 끝 빛
uniform vec2 uHand[42];         // 양손 랜드마크
uniform int uHandN;

vec2 mir(vec2 uv){ return vec2(1.0 - uv.x, uv.y); }       // 거울 모드
float person(vec2 uv){ return uHasMask > 0.5 ? texture(uMask, mir(uv)).r : 0.0; }
vec2 A(vec2 uv){ return vec2(uv.x * uAspect, uv.y); }     // 화면비 보정 좌표

void main(){
  vec2 uv = vUv;
  vec3 srgb = texture(uVideo, mir(uv)).rgb;
  vec3 lin = pow(srgb, vec3(2.2));
  float pm = smoothstep(0.25, 0.75, person(uv));

  // 가장 가까운 손 랜드마크까지 거리
  float dh = 10.0;
  for (int i = 0; i < 42; i++) { if (i >= uHandN) break; dh = min(dh, distance(A(uv), A(uHand[i]))); }

  float flick = 1.0 + 0.025 * sin(uTime * 23.0) * sin(uTime * 7.3);
  vec3 light = vec3(0.0), sss = vec3(0.0);

  // 1) 각 빛이 사람/손/배경을 비춤
  for (int j = 0; j < MAXL; j++) {
    if (j >= uN) break;
    float I = uI[j] * flick;
    if (I < 0.002) continue;
    float R  = max(uR[j], 0.012);
    float Rr = max(R, 0.05);                       // 빛이 닿는 범위 (손가락 빛도 너무 좁지 않게)
    float d  = distance(A(uv), A(uL[j]));
    float Ip = 1.0 / (1.0 + pow(d / (Rr * 3.2), 2.0));
    float Ib = 0.55 / (1.0 + pow(d / (Rr * 6.5), 2.0));
    float sh = 0.0;                                // 배경에 드리우는 사람 그림자
    for (int i = 1; i <= 8; i++) sh += smoothstep(0.3, 0.8, person(uv + (uL[j] - uv) * (0.035 * float(i))));
    sh = (sh / 8.0) * uShadow * (1.0 - pm);
    float L = mix(Ib * (1.0 - 0.9 * sh), Ip, pm);
    float hand = exp(-pow(dh / (Rr * 0.9), 2.0)) * max(pm, 0.35);
    float nearL = exp(-pow(d / (Rr * 2.2), 2.0));
    light += uWarm * (L * 2.6 + hand * nearL * 0.9) * I;
    sss += vec3(1.0, 0.28, 0.10) * hand * nearL * 1.4 * I;   // 빛이 비쳐 붉게 물드는 손
  }
  vec3 col = lin * (uAmb + light) + lin * sss;

  // 2) 빛 자체 (빛번짐, 별빛, 가상 전구)
  for (int j = 0; j < MAXL; j++) {
    if (j >= uN) break;
    float I = uI[j] * flick;
    if (I < 0.002) continue;
    float R = max(uR[j], 0.012);
    vec2 q = A(uv) - A(uL[j]);
    float d = length(q);
    vec2 dir = normalize(uDir[j] + vec2(1e-5));
    vec2 per = vec2(-dir.y, dir.x);
    float al = dot(q, dir), ac = dot(q, per);

    if (uT[j] > 0.5) {
      if (uVirtual > 0.5) {
        float glass = d - R;
        float neckW = mix(R * 0.42, R * 0.62, smoothstep(-R * 1.5, -R * 0.6, al));
        float neck  = max(abs(ac) - neckW, max(-al - R * 1.5, al + R * 0.4));
        float gm = smoothstep(0.004, -0.004, min(glass, neck));
        float base = smoothstep(0.004, -0.004, max(abs(ac) - R * 0.43, max(-al - R * 2.1, al + R * 1.35)));
        float fil = exp(-pow(abs(ac) / (R * 0.06), 2.0)) * exp(-pow((al - R * 0.05) / (R * 0.35), 2.0));
        vec3 lit = uWarm * (1.6 + 2.5 * exp(-pow(d / R, 2.0))) + vec3(1.0, 0.95, 0.85) * fil * 4.0;
        col = mix(col, lit, gm * clamp(I, 0.0, 1.0));
        float ridges = 0.6 + 0.4 * sin(al / R * 38.0);
        vec3 metal = vec3(0.55, 0.53, 0.5) * ridges * (0.15 + 0.85 * clamp(uAmb + I * 0.8, 0.0, 1.5));
        col = mix(col, metal, base * (1.0 - gm));
      }
      float g1 = exp(-pow(d / (R * 0.7), 2.0));
      float g2 = exp(-pow(d / (R * 2.4), 2.0));
      float g3 = exp(-pow(d / (R * 7.0), 2.0));
      float streak = exp(-pow(ac / (R * 0.12), 2.0)) * exp(-pow(al / (R * 6.0), 2.0));
      col += (vec3(1.0, 0.97, 0.9) * g1 * 1.8 + uWarm * g2 * 0.7 + uWarm * g3 * 0.18 + uWarm * streak * 0.08) * I;
    } else {
      // 손가락 끝에 맺힌 작은 빛: 밝은 핵 + 번짐 + 십자 별빛
      float core = exp(-pow(d / (R * 0.32), 2.0));
      float halo = exp(-pow(d / (R * 1.3), 2.0));
      float wide = exp(-pow(d / (R * 5.0), 2.0));
      float tw = 0.85 + 0.15 * sin(uTime * 9.0 + float(j) * 2.1);
      float star = exp(-pow(q.x / (R * 0.05), 2.0)) * exp(-pow(q.y / (R * 2.6 * tw), 2.0))
                 + exp(-pow(q.y / (R * 0.05), 2.0)) * exp(-pow(q.x / (R * 2.6 * tw), 2.0));
      col += (vec3(1.0, 0.98, 0.94) * core * 2.4 + uWarm * halo * 0.9 + uWarm * wide * 0.22 + mix(vec3(1.0), uWarm, 0.4) * star * 0.45) * I;
    }
  }

  col = col * (1.0 + col / 6.0) / (1.0 + col);
  col = pow(col, vec3(1.0 / 2.2));
  if (uDebug > 0.5) col = mix(col, vec3(0.1, 0.6, 1.0), pm * 0.35);
  outColor = vec4(col, 1.0);
}
</script>

<script type="module">
import { FilesetResolver, HandLandmarker, ImageSegmenter, ImageEmbedder }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const video = $("video"), glc = $("gl"), ovc = $("overlay");
const statusEl = $("status");

/* ---------------- 설정 ---------------- */
const ui = {};
for (const id of ["mode","intensity","dark","kelvin","shadow","virtual","sound","debug"]) ui[id] = $(id);
function readUI() {
  $("vIntensity").textContent = (+ui.intensity.value).toFixed(2);
  $("vDark").textContent = Math.round(ui.dark.value * 100) + "%";
  $("vKelvin").textContent = ui.kelvin.value + "K";
  $("vShadow").textContent = Math.round(ui.shadow.value * 100) + "%";
}
document.querySelectorAll("#panel input, #panel select").forEach(el => el.addEventListener("input", readUI));
readUI();

// 색온도(K) → RGB (Tanner Helland 근사)
function kelvinToRGB(k) {
  const t = k / 100; let r, g, b;
  r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
  g = t <= 66 ? 99.47 * Math.log(t) - 161.12 : 288.12 * Math.pow(t - 60, -0.0755);
  b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04);
  const c = v => Math.min(1, Math.max(0, v / 255));
  return [c(r), c(g), c(b)];
}

/* ---------------- WebGL ---------------- */
const gl = glc.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
if (!gl) { $("err").textContent = "이 브라우저는 WebGL2를 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요."; }

const VS = document.getElementById("vs").textContent.trim();
const FS = document.getElementById("fs").textContent.trim();
const MAXL = 3;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog, U = {}, texVideo, texMask;
function initGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ["uVideo","uMask","uAspect","uAmb","uShadow","uVirtual","uHasMask","uDebug","uTime","uWarm",
                   "uN","uL","uDir","uR","uI","uT","uHand","uHandN"])
    U[n] = gl.getUniformLocation(prog, n);
  const mk = () => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  texVideo = mk(); texMask = mk();
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  gl.uniform1i(U.uVideo, 0); gl.uniform1i(U.uMask, 1);
}

/* ---------------- 상태 ---------------- */
const S = { mask: null, maskW: 0, maskH: 0, hasMask: false, maskDirty: false };
// 클릭 모드용 수동 전구
const manual = { on: false, I: 0, flickerT: -1, L: { x: 0.5, y: 0.38 }, R: 0.07, dir: { x: 0, y: -1 } };
// 손별 상태 (최대 2개, 왼손/오른손으로 구분)
const hands = new Map();
function newHand() {
  return { P: [], seen: false, lastSeen: 0, Lp: 0.1,
    palm: { x: 0.5, y: 0.5 }, dir: { x: 0, y: -1 },   // palm: 화면비 보정 좌표
    // 찾은 전구 위치 (손 기준 좌표: a = 손가락 방향, b = 옆 방향, k = 크기, 모두 손 크기 단위)
    found: null, hasBulb: false, score: 0, miss: 0,
    queue: [], results: [], mode: "global",
    bulbEst: { x: 0.5, y: 0.5 }, bulbR: 0.07, L: null, R: 0.05, type: 1,
    on: false, I: 0, flickerT: -1 };
}

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVideo);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  if (S.maskDirty) { gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, S.maskW, S.maskH, 0, gl.RED, gl.UNSIGNED_BYTE, S.mask); S.maskDirty = false; }

  const dark = +ui.dark.value;
  gl.uniform1f(U.uAspect, aspect);
  gl.uniform1f(U.uAmb, RS.phase ? 0.85 : Math.pow(1 - dark, 1.6));
  gl.uniform1f(U.uShadow, +ui.shadow.value);
  gl.uniform1f(U.uVirtual, ui.virtual.checked ? 1 : 0);
  gl.uniform1f(U.uHasMask, S.hasMask ? 1 : 0);
  gl.uniform1f(U.uDebug, ui.debug.checked ? 1 : 0);
  gl.uniform1f(U.uTime, now / 1000);
  gl.uniform3fv(U.uWarm, kelvinToRGB(+ui.kelvin.value));
  gl.uniform1i(U.uN, n);
  gl.uniform2fv(U.uL, aL); gl.uniform2fv(U.uDir, aD);
  gl.uniform1fv(U.uR, aR); gl.uniform1fv(U.uI, aI); gl.uniform1fv(U.uT, aT);
  gl.uniform2fv(U.uHand, hp);
  gl.uniform1i(U.uHandN, hn);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawOverlay();

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; updateStatus(); }
}

function updateStatus() {
  let msg;
  const vis = visibleHands();
  const anyOn = vis.some(H => H.on);
  if (!handLM || !embedder) msg = "인식 모델 불러오는 중…";
  else if (RS.phase) msg = "전구 등록 중…";
  else if (ui.mode.value === "click") msg = manual.on ? "<b>켜짐</b> · 클릭하거나 스페이스바로 끄기" : "클릭하거나 스페이스바를 눌러 켜기";
  else if (!isRegistered()) msg = "<b>내 전구</b>를 등록하면 전구를 들었을 때 켜져요";
  else if (anyOn) msg = "<b>💡 켜짐</b>";
  else if (ui.mode.value === "raise" && vis.some(H => H.hasBulb)) msg = "전구를 위로 들어 올리면 켜져요";
  else msg = "전구를 들어 카메라에 보여 주세요";
  statusEl.innerHTML = msg + (ui.debug.checked ? " · " + fps + "fps" : "");
}

/* ---------------- 시작 ---------------- */
async function loadModels() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk = async (Cls, opts) => {
    try { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: "GPU" } }); }
    catch (e) { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: "CPU" } }); }
  };
  const [h, s, e] = await Promise.all([
    mk(HandLandmarker, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
      runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    }),
    mk(ImageSegmenter, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite" },
      runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false,
    }),
    mk(ImageEmbedder, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" },
      runningMode: "IMAGE", l2Normalize: true, quantize: false,
    }),
  ]);
  handLM = h; segm = s; embedder = e;
  // 저장된 등록 데이터가 다른 모델 크기면 버림
  if (reg.pos.length) {
    let d = 0;
    try { cctx.fillRect(0, 0, crop.width, crop.height); d = embedder.embed(crop).embeddings[0].floatEmbedding.length; } catch (err) {}
    if (d && reg.pos[0].length !== d) { reg.pos = []; reg.neg = []; }
  }
  refreshRegUI();
}

function resize() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  aspect = vw / vh;
  glc.width = ovc.width = vw; glc.height = ovc.height = vh;
}

$("start").addEventListener("click", async () => {
  const btn = $("start"); btn.disabled = true; btn.textContent = "카메라 연결 중…"; $("err").textContent = "";
  try {
    initGL();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    video.srcObject = stream; await video.play();
    resize(); video.addEventListener("resize", resize);
    $("intro").hidden = true;
    statusEl.hidden = false; $("panel").hidden = false;
    if (innerWidth < 520) $("panel").open = false;
    requestAnimationFrame(loop);
    refreshRegUI();
    loadModels().catch(e => { console.error(e); statusEl.textContent = "인식 모델을 불러오지 못했어요. 새로고침해 주세요."; });
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = "다시 시도";
    $("err").textContent = e && e.name === "NotAllowedError"
      ? "카메라 권한이 거부됐어요. 주소창의 카메라 아이콘에서 허용해 주세요."
      : "카메라를 켤 수 없어요: " + (e.message || e);
  }
});

function toggleManual() {
  ui.mode.value = "click"; manual.on = !manual.on; updateStatus();
}
$("toggle").addEventListener("click", toggleManual);
$("stage").addEventListener("click", () => { if (ui.mode.value === "click") { manual.on = !manual.on; updateStatus(); } });
addEventListener("keydown", (e) => { if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT") { e.preventDefault(); toggleManual(); } });
ui.mode.addEventListener("change", updateStatus);

$("snap").addEventListener("click", () => {
  glc.toBlob((b) => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = "bulb-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
});
</script>
