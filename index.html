<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LetThereBeLight</title>
<style>
  :root { --fg: #d8d8d8; --dim: #7a7a7a; --bg: #000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #stage { position: fixed; inset: 0; }
  #stage canvas, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video { opacity: 0; pointer-events: none; }
  #panel { position: fixed; top: 8px; left: 8px; padding: 6px 8px; background: rgba(0,0,0,.6); display: grid; gap: 4px; }
  #panel label { display: grid; grid-template-columns: 64px 120px 34px; align-items: center; gap: 6px; }
  #panel label.ck { grid-template-columns: 14px auto; gap: 4px; cursor: pointer; }
  #panel label.ck input { width: auto; }
  #overlay { pointer-events: none; }
  #panel span { color: var(--dim); }
  #panel i { font-style: normal; text-align: right; }
  #panel input { width: 100%; margin: 0; accent-color: #aaa; }
  #err { position: fixed; bottom: 8px; left: 8px; color: #f66; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
</div>
<div id="panel">
  <label><span>brightness</span><input type="range" id="intensity" min="0.3" max="2.5" step="0.05" value="1.2"><i id="vIntensity"></i></label>
  <label><span>size</span><input type="range" id="size" min="0.4" max="2" step="0.05" value="1"><i id="vSize"></i></label>
  <label><span>darkness</span><input type="range" id="dark" min="0" max="0.95" step="0.01" value="0.72"><i id="vDark"></i></label>
  <label class="ck"><input type="checkbox" id="debug"><span>debug</span></label>
</div>
<div id="err"></div>
<script type="x-shader/x-vertex" id="vs">
#version 300 es
in vec2 p; out vec2 vUv;
void main(){ vUv = vec2((p.x+1.0)*0.5, (1.0-p.y)*0.5); gl_Position = vec4(p,0.0,1.0); }
</script>
<script type="x-shader/x-fragment" id="fs">
#version 300 es
precision highp float;
#define MAXL 3
in vec2 vUv; out vec4 outColor;
uniform sampler2D uVideo, uMask;
uniform float uAspect, uAmb, uVirtual, uHasMask, uDebug, uTime;
uniform vec3 uWarm;
uniform int uN;
uniform vec2 uL[MAXL];
uniform vec2 uDir[MAXL];
uniform float uR[MAXL];
uniform float uI[MAXL];
uniform float uT[MAXL];
uniform vec2 uHand[42];
uniform int uHandN;

vec2 mir(vec2 uv){ return vec2(1.0 - uv.x, uv.y); }
float person(vec2 uv){ return uHasMask > 0.5 ? texture(uMask, mir(uv)).r : 0.0; }
vec2 A(vec2 uv){ return vec2(uv.x * uAspect, uv.y); }

void main(){
  vec2 uv = vUv;
  vec3 srgb = texture(uVideo, mir(uv)).rgb;
  vec3 lin = pow(srgb, vec3(2.2));
  float pm = smoothstep(0.25, 0.75, person(uv));


  float dh = 10.0;
  for (int i = 0; i < 42; i++) { if (i >= uHandN) break; dh = min(dh, distance(A(uv), A(uHand[i]))); }

  float flick = 1.0 + 0.025 * sin(uTime * 23.0) * sin(uTime * 7.3);
  vec3 light = vec3(0.0), sss = vec3(0.0);


  for (int j = 0; j < MAXL; j++) {
    if (j >= uN) break;
    float I = uI[j] * flick;
    if (I < 0.002) continue;
    float R  = max(uR[j], 0.012);
    float Rr = max(R, 0.05);
    float d  = distance(A(uv), A(uL[j]));
    float Ip = 1.0 / (1.0 + pow(d / (Rr * 3.2), 2.0));
    float Ib = 0.55 / (1.0 + pow(d / (Rr * 6.5), 2.0));
    float L = mix(Ib, Ip, pm);
    float hand = exp(-pow(dh / (Rr * 0.9), 2.0)) * max(pm, 0.35);
    float nearL = exp(-pow(d / (Rr * 2.2), 2.0));
    light += uWarm * (L * 2.6 + hand * nearL * 0.9) * I;
    sss += vec3(1.0, 0.28, 0.10) * hand * nearL * 1.4 * I;
  }
  vec3 col = lin * (uAmb + light) + lin * sss;


  for (int j = 0; j < MAXL; j++) {
    if (j >= uN) break;
    float I = uI[j] * flick;
    if (I < 0.002) continue;
    float R = max(uR[j], 0.012);
    vec2 q = A(uv) - A(uL[j]);
    float d = length(q);
    vec2 dir = normalize(uDir[j] + vec2(1e-5));
    vec2 per = vec2(-dir.y, dir.x);
    float al = dot(q, dir), ac = dot(q, per);

    if (uT[j] > 0.5) {
      if (uVirtual > 0.5) {
        float glass = d - R;
        float neckW = mix(R * 0.42, R * 0.62, smoothstep(-R * 1.5, -R * 0.6, al));
        float neck  = max(abs(ac) - neckW, max(-al - R * 1.5, al + R * 0.4));
        float gm = smoothstep(0.004, -0.004, min(glass, neck));
        float base = smoothstep(0.004, -0.004, max(abs(ac) - R * 0.43, max(-al - R * 2.1, al + R * 1.35)));
        float fil = exp(-pow(abs(ac) / (R * 0.06), 2.0)) * exp(-pow((al - R * 0.05) / (R * 0.35), 2.0));
        vec3 lit = uWarm * (1.6 + 2.5 * exp(-pow(d / R, 2.0))) + vec3(1.0, 0.95, 0.85) * fil * 4.0;
        col = mix(col, lit, gm * clamp(I, 0.0, 1.0));
        float ridges = 0.6 + 0.4 * sin(al / R * 38.0);
        vec3 metal = vec3(0.55, 0.53, 0.5) * ridges * (0.15 + 0.85 * clamp(uAmb + I * 0.8, 0.0, 1.5));
        col = mix(col, metal, base * (1.0 - gm));
      }
      float g1 = exp(-pow(d / (R * 0.7), 2.0));
      float g2 = exp(-pow(d / (R * 2.4), 2.0));
      float g3 = exp(-pow(d / (R * 7.0), 2.0));
      float streak = exp(-pow(ac / (R * 0.12), 2.0)) * exp(-pow(al / (R * 6.0), 2.0));
      col += (vec3(1.0, 0.97, 0.9) * g1 * 1.8 + uWarm * g2 * 0.7 + uWarm * g3 * 0.18 + uWarm * streak * 0.08) * I;
    } else {

      float core = exp(-pow(d / (R * 0.32), 2.0));
      float halo = exp(-pow(d / (R * 1.3), 2.0));
      float wide = exp(-pow(d / (R * 5.0), 2.0));
      float tw = 0.85 + 0.15 * sin(uTime * 9.0 + float(j) * 2.1);
      float star = exp(-pow(q.x / (R * 0.05), 2.0)) * exp(-pow(q.y / (R * 2.6 * tw), 2.0))
                 + exp(-pow(q.y / (R * 0.05), 2.0)) * exp(-pow(q.x / (R * 2.6 * tw), 2.0));
      col += (vec3(1.0, 0.98, 0.94) * core * 2.4 + uWarm * halo * 0.9 + uWarm * wide * 0.22 + mix(vec3(1.0), uWarm, 0.4) * star * 0.45) * I;
    }
  }

  col = col * (1.0 + col / 6.0) / (1.0 + col);
  col = pow(col, vec3(1.0 / 2.2));
  if (uDebug > 0.5) col = mix(col, vec3(0.1, 0.6, 1.0), pm * 0.35);
  outColor = vec4(col, 1.0);
}
</script>

<script type="module">
import { FilesetResolver, HandLandmarker, ImageSegmenter }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const video = $("video"), glc = $("gl"), ovc = $("overlay");

/* ---------------- settings ---------------- */
const ui = {};
for (const id of ["intensity", "size", "dark", "debug"]) ui[id] = $(id);
const CFG = { kelvin: 2700 };
function readUI() {
  $("vIntensity").textContent = (+ui.intensity.value).toFixed(2);
  $("vSize").textContent = (+ui.size.value).toFixed(2);
  $("vDark").textContent = (+ui.dark.value).toFixed(2);
}
for (const id in ui) ui[id].addEventListener("input", readUI);
readUI();

function kelvinToRGB(k) {
  const t = k / 100; let r, g, b;
  r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
  g = t <= 66 ? 99.47 * Math.log(t) - 161.12 : 288.12 * Math.pow(t - 60, -0.0755);
  b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04);
  const c = v => Math.min(1, Math.max(0, v / 255));
  return [c(r), c(g), c(b)];
}

/* ---------------- WebGL ---------------- */
const gl = glc.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
if (!gl) { $("err").textContent = "WebGL2 not supported"; }

const VS = document.getElementById("vs").textContent.trim();
const FS = document.getElementById("fs").textContent.trim();
const MAXL = 3;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog, U = {}, texVideo, texMask;
function initGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ["uVideo","uMask","uAspect","uAmb","uVirtual","uHasMask","uDebug","uTime","uWarm",
                   "uN","uL","uDir","uR","uI","uT","uHand","uHandN"])
    U[n] = gl.getUniformLocation(prog, n);
  const mk = () => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  texVideo = mk(); texMask = mk();
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  gl.uniform1i(U.uVideo, 0); gl.uniform1i(U.uMask, 1);
}

/* ---------------- state ---------------- */
const S = { mask: null, maskW: 0, maskH: 0, hasMask: false, maskDirty: false };
const hands = new Map();
function newHand() {
  return { P: [], seen: false, lastSeen: 0, Lp: 0.1,
    palm: { x: 0.5, y: 0.5 }, dir: { x: 0, y: -1 },
    dot: null, dotSeen: 0, dotHits: 0, hasBulb: false, dotArea: 0, roi: null,
    L: null, R: 0.04, on: false, I: 0, flickerT: -1 };
}
let handLM = null, segm = null, aspect = 16 / 9;

/* ---------------- hands ---------------- */
function updateHand(H, lms, now) {
  const P = lms.map(p => ({ x: 1 - p.x, y: p.y }));
  H.P = P;
  const ax = v => ({ x: v.x * aspect, y: v.y });
  const w = ax(P[0]), m = ax(P[9]);
  const palm = [0, 5, 9, 13, 17].map(i => ax(P[i])).reduce((a, b) => ({ x: a.x + b.x / 5, y: a.y + b.y / 5 }), { x: 0, y: 0 });
  let dx = m.x - w.x, dy = m.y - w.y; const Lp = Math.hypot(dx, dy) || 0.1; dx /= Lp; dy /= Lp;
  const k = H.seen ? 0.6 : 1;
  H.palm.x += (palm.x - H.palm.x) * k; H.palm.y += (palm.y - H.palm.y) * k;
  H.dir.x += (dx - H.dir.x) * k; H.dir.y += (dy - H.dir.y) * k;
  const dl = Math.hypot(H.dir.x, H.dir.y) || 1; H.dir.x /= dl; H.dir.y /= dl;
  H.Lp += (Lp - H.Lp) * k;
  H.seen = true; H.lastSeen = now;
}

/* ---------------- sticker detection ---------------- */

const FW = 640;
const frameC = document.createElement("canvas"); frameC.width = FW; frameC.height = 540;
const fctx = frameC.getContext("2d", { willReadFrequently: true });
let frameGrabbed = -1;
function grabFrame() {
  if (frameGrabbed === frame) return;
  frameGrabbed = frame;
  const fh = Math.round(FW / aspect); if (frameC.height !== fh) frameC.height = fh;
  fctx.drawImage(video, 0, 0, frameC.width, frameC.height);
}

const dotColor = { h: 120, s: 0.22, v: 0.12, tol: 50 };   // green, hue 70..170

function hsv(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 0) {
    if (mx === r) h = 60 * (((g - b) / d) % 6);
    else if (mx === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
    if (h < 0) h += 360;
  }
  return { h, s: mx ? d / mx : 0, v: mx / 255 };
}
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

function dotSat(r, g, b) {
  if (g < r || g < b) return 0;                       // hue 60..180 needs green to be the max
  const mn = r < b ? r : b, d = g - mn;
  if (g < dotColor.v * 255 || d < dotColor.s * g || d === 0) return 0;
  const hh = 60 * ((b - r) / d + 2);
  return Math.abs(hh - dotColor.h) <= dotColor.tol ? d / g : 0;
}
let maskBuf = new Uint8Array(0), stackBuf = new Int32Array(0), satBuf = new Float32Array(0), dilBuf = new Uint8Array(0);
const tracks = [];   // one entry per sticker on screen
let trackId = 0, dbgMask = null;

// every round green blob in the frame -> { x, y (mirrored, 0..1), r (radius / frame height), area }
function findStickers() {
  grabFrame();
  const w = frameC.width, h = frameC.height, n = w * h;
  const d = fctx.getImageData(0, 0, w, h).data;
  if (maskBuf.length < n) { maskBuf = new Uint8Array(n); stackBuf = new Int32Array(n); satBuf = new Float32Array(n); dilBuf = new Uint8Array(n); }
  const m = maskBuf, sat = satBuf;
  for (let i = 0; i < n; i++) { const v = dotSat(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]); sat[i] = v; m[i] = v > 0 ? 1 : 0; }
  dbgMask = ui.debug.checked ? { w, h, m: m.slice(0, n) } : null;
  // fill 1-2px gaps (glare on glossy stickers, fingers on the edge)
  for (let pass = 0; pass < 2; pass++) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      dilBuf[i] = m[i] || (x > 0 && m[i - 1]) || (x < w - 1 && m[i + 1]) || (y > 0 && m[i - w]) || (y < h - 1 && m[i + w]) ? 1 : 0;
    }
    m.set(dilBuf.subarray(0, n));
  }
  const out = [], minArea = 12, maxArea = (0.25 * h) ** 2;
  for (let i = 0; i < n; i++) {
    if (m[i] !== 1) continue;
    let sp = 0, cnt = 0, sx = 0, sy = 0, ss = 0, ux = 0, uy = 0, uxx = 0, uyy = 0, uxy = 0;
    stackBuf[sp++] = i; m[i] = 2;
    while (sp) {
      const j = stackBuf[--sp], jx = j % w, jy = (j / w) | 0, wj = sat[j];
      cnt++; sx += jx * wj; sy += jy * wj; ss += wj;
      ux += jx; uy += jy; uxx += jx * jx; uyy += jy * jy; uxy += jx * jy;
      if (jx > 0 && m[j - 1] === 1) { m[j - 1] = 2; stackBuf[sp++] = j - 1; }
      if (jx < w - 1 && m[j + 1] === 1) { m[j + 1] = 2; stackBuf[sp++] = j + 1; }
      if (jy > 0 && m[j - w] === 1) { m[j - w] = 2; stackBuf[sp++] = j - w; }
      if (jy < h - 1 && m[j + w] === 1) { m[j + w] = 2; stackBuf[sp++] = j + w; }
    }
    if (cnt < minArea || cnt > maxArea || ss <= 0) continue;
    const bx = sx / ss, by = sy / ss;
    // round = aspect ~1 (2:1 when tilted) and filled; leaves / lines are long, crosses / smudges are not filled
    const mx = ux / cnt, my = uy / cnt;
    const cxx = uxx / cnt - mx * mx, cyy = uyy / cnt - my * my, cxy = uxy / cnt - mx * my;
    const tr = cxx + cyy, det = cxx * cyy - cxy * cxy, disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
    const l1 = tr / 2 + disc, l2 = Math.max(1e-6, tr / 2 - disc);
    const asp = Math.sqrt(l1 / l2), fill = cnt / (4 * Math.PI * Math.sqrt(l1 * l2));
    const x = 1 - (bx + 0.5) / w, y = (by + 0.5) / h;
    const tracked = tracks.some(t => Math.hypot((x - t.x) * aspect, y - t.y) < Math.max(0.03, t.r * 4));
    const isRound = asp < 2.3 && fill > 0.55;
    if (!isRound && !(tracked && asp < 3.2)) continue;   // a tracked sticker may look squashed for a moment
    out.push({ x, y, r: Math.sqrt(cnt / Math.PI) / h, area: cnt });
  }
  return out;
}

const visibleHands = () => [...hands.values()].filter(H => H.seen);

// match this frame's stickers to the ones already on screen (nearest first)
function stepFind(now) {
  const found = findStickers().sort((a, b) => b.area - a.area);
  for (const t of tracks) t.matched = false;
  for (const f of found) {
    let best = null, bd = 1e9;
    for (const t of tracks) { if (t.matched) continue; const dd = Math.hypot((f.x - t.x) * aspect, f.y - t.y); if (dd < bd) { bd = dd; best = t; } }
    if (best && bd < Math.max(0.05, best.r * 5)) {
      const k = 0.7; best.x += (f.x - best.x) * k; best.y += (f.y - best.y) * k; best.r += (f.r - best.r) * 0.3;
      best.seen = now; best.area = f.area; best.hits = Math.min(best.hits + 1, 10); best.matched = true;
    } else if (tracks.length < 6) {
      tracks.push({ id: trackId++, x: f.x, y: f.y, r: f.r, area: f.area, seen: now, hits: 1, matched: true, live: false,
                    on: false, I: 0, flickerT: -1, L: null, R: 0.04, dir: { x: 0, y: -1 } });
    }
  }
  for (const t of tracks) if (!t.matched) t.hits = 0;
}

/* ---------------- sound ---------------- */
let actx = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
}
addEventListener("pointerdown", unlockAudio); addEventListener("keydown", unlockAudio);
function click(on) {
  try {
    unlockAudio();
    const t = actx.currentTime, len = 0.04;
    const b = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
    const src = actx.createBufferSource(); src.buffer = b;
    const f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = on ? 2600 : 1700; f.Q.value = 1.4;
    const g = actx.createGain(); g.gain.value = 0.9;
    src.connect(f).connect(g).connect(actx.destination); src.start(t);
  } catch (e) {}
}

/* ---------------- on/off + flicker ---------------- */
const FLICKER = [0, 0.7, 0.05, 0.9, 0.25, 1.0];
function stepLight(o, want, now, dt) {
  if (want && !o.on) { o.on = true; o.flickerT = now; click(true); }
  if (!want && o.on) { o.on = false; o.flickerT = -1; click(false); }
  const max = +ui.intensity.value;
  if (o.on && o.flickerT >= 0) {
    const e = (now - o.flickerT) / 70 | 0;
    if (e < FLICKER.length) { o.I = FLICKER[e] * max; return; }
    o.flickerT = -1;
  }
  const target = o.on ? max : 0;
  o.I += (target - o.I) * Math.min(1, dt * (o.on ? 10 : 7));
}
function stepHands(now, dt) {
  for (const [key, H] of hands) {
    if (H.seen && now - H.lastSeen > 250) H.seen = false;
    if (!H.seen && now - H.lastSeen > 1000) hands.delete(key);
  }
  for (let i = tracks.length - 1; i >= 0; i--) {
    const t = tracks[i], visible = now - t.seen < 200;
    if (t.hits >= 6) t.live = true;   // must be seen 6 frames in a row (~0.2s) before it lights up
    if (!visible) t.live = false;
    stepLight(t, t.live, now, dt);
    if (!t.L) t.L = { x: t.x, y: t.y };
    const k = Math.min(1, dt * 40);
    t.L.x += (t.x - t.L.x) * k; t.L.y += (t.y - t.L.y) * k;
    const tR = Math.min(0.2, Math.max(0.012, t.r * 5)) * +ui.size.value;
    t.R += (tR - t.R) * Math.min(1, dt * 12);
    if (!visible && t.I < 0.005) tracks.splice(i, 1);
  }
}

/* ---------------- main loop ---------------- */
let frame = 0, lastT = performance.now(), lastVideoTime = -1;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (video.readyState < 2) return;

  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    frame++;
    if (handLM) {
      const r = handLM.detectForVideo(video, now);
      const used = new Set();
      (r.landmarks || []).forEach((lms, i) => {
        let key = (r.handednesses && r.handednesses[i] && r.handednesses[i][0] && r.handednesses[i][0].categoryName) || ("h" + i);
        if (used.has(key)) key += i;
        used.add(key);
        if (!hands.has(key)) hands.set(key, newHand());
        updateHand(hands.get(key), lms, now);
      });
    }
    if (segm && frame % 2 === 0) {
      segm.segmentForVideo(video, now, (res) => {
        const masks = res.confidenceMasks; if (!masks || !masks.length) return;
        const mk = masks[masks.length - 1];
        const f = mk.getAsFloat32Array(), w = mk.width, h = mk.height;
        if (!S.mask || S.mask.length !== w * h) { S.mask = new Uint8Array(w * h); S.maskW = w; S.maskH = h; }
        const M = S.mask;
        for (let i = 0; i < f.length; i++) M[i] = (M[i] * 0.4 + f[i] * 255 * 0.6) | 0;
        S.hasMask = true; S.maskDirty = true;
      });
    }
    stepFind(now);
  }
  stepHands(now, dt);

  const lights = [];
  for (const t of tracks) if (t.L && t.I > 0.002) lights.push(t);
  const n = Math.min(MAXL, lights.length);
  const aL = new Float32Array(MAXL * 2), aD = new Float32Array(MAXL * 2), aR = new Float32Array(MAXL), aI = new Float32Array(MAXL), aT = new Float32Array(MAXL);
  for (let i = 0; i < n; i++) {
    const l = lights[i];
    aL[i * 2] = l.L.x; aL[i * 2 + 1] = l.L.y; aD[i * 2] = l.dir.x; aD[i * 2 + 1] = l.dir.y;
    aR[i] = l.R; aI[i] = l.I; aT[i] = 1;
  }
  const hp = new Float32Array(84); let hn = 0;
  for (const H of hands.values()) if (H.seen) for (const p of H.P) { if (hn < 42) { hp[hn * 2] = p.x; hp[hn * 2 + 1] = p.y; hn++; } }

  gl.viewport(0, 0, glc.width, glc.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVideo);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
  if (S.maskDirty) { gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, S.maskW, S.maskH, 0, gl.RED, gl.UNSIGNED_BYTE, S.mask); S.maskDirty = false; }

  gl.uniform1f(U.uAspect, aspect);
  gl.uniform1f(U.uAmb, Math.pow(1 - +ui.dark.value, 1.6));
  gl.uniform1f(U.uVirtual, 0);
  gl.uniform1f(U.uHasMask, S.hasMask ? 1 : 0);
  gl.uniform1f(U.uDebug, 0);
  gl.uniform1f(U.uTime, now / 1000);
  gl.uniform3fv(U.uWarm, kelvinToRGB(CFG.kelvin));
  gl.uniform1i(U.uN, n);
  gl.uniform2fv(U.uL, aL); gl.uniform2fv(U.uDir, aD);
  gl.uniform1fv(U.uR, aR); gl.uniform1fv(U.uI, aI); gl.uniform1fv(U.uT, aT);
  gl.uniform2fv(U.uHand, hp);
  gl.uniform1i(U.uHandN, hn);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  drawOverlay();
}

/* ---------------- debug overlay ---------------- */
const octx = ovc.getContext("2d"), dbgC = document.createElement("canvas");
function drawOverlay() {
  octx.clearRect(0, 0, ovc.width, ovc.height);
  if (!ui.debug.checked) return;
  const W = ovc.width, Hh = ovc.height;
  if (dbgMask) {
    const M = dbgMask, img = new ImageData(M.w, M.h);
    for (let i = 0; i < M.m.length; i++) if (M.m[i]) { img.data[i * 4 + 1] = 230; img.data[i * 4 + 2] = 255; img.data[i * 4 + 3] = 200; }
    dbgC.width = M.w; dbgC.height = M.h; dbgC.getContext("2d").putImageData(img, 0, 0);
    octx.save(); octx.translate(W, 0); octx.scale(-1, 1); octx.drawImage(dbgC, 0, 0, W, Hh); octx.restore();
  }
  octx.fillStyle = "#4cf";
  for (const h of visibleHands()) for (const p of h.P) { octx.beginPath(); octx.arc(p.x * W, p.y * Hh, 3, 0, 7); octx.fill(); }
  octx.font = "12px ui-monospace, Menlo, monospace"; octx.lineWidth = 1.5;
  for (const t of tracks) {
    const fx = t.x * W, fy = t.y * Hh;
    octx.strokeStyle = t.live ? "#ff5a5a" : "rgba(255,255,255,.6)";
    octx.beginPath(); octx.moveTo(fx - 10, fy); octx.lineTo(fx + 10, fy); octx.moveTo(fx, fy - 10); octx.lineTo(fx, fy + 10); octx.stroke();
    octx.fillStyle = "rgba(0,0,0,.6)"; octx.fillRect(fx + 12, fy - 9, 92, 18);
    octx.fillStyle = t.live ? "#ffc861" : "#ccc";
    octx.fillText(t.live ? "found " + t.area + "px" : "lost", fx + 16, fy + 4);
  }
}

/* ---------------- startup ---------------- */
async function loadModels() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk = async (Cls, opts) => {
    try { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: "GPU" } }); }
    catch (e) { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: "CPU" } }); }
  };
  const [h, s] = await Promise.all([
    mk(HandLandmarker, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
      runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    }),
    mk(ImageSegmenter, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite" },
      runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false,
    }),
  ]);
  handLM = h; segm = s;
}
function resize() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  aspect = vw / vh;
  glc.width = ovc.width = vw; glc.height = ovc.height = vh;
}
(async () => {
  try {
    initGL();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    video.srcObject = stream; await video.play();
    resize(); video.addEventListener("resize", resize);
    requestAnimationFrame(loop);
    loadModels().catch(e => { console.error(e); $("err").textContent = "model load failed"; });
  } catch (e) {
    console.error(e);
    $("err").textContent = "camera: " + (e.name || e.message || e);
  }
})();
</script>
